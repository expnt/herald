name: checks

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  DOCKER_CMD: docker
  UV_CACHE_DIR: /tmp/.uv-cache

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: DeterminateSystems/nix-installer-action@v22

      - uses: DeterminateSystems/flakehub-cache-action@v3

      - name: pre-commit hooks
        run: nix develop --command prek run --all-files

  integration-tests:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: DeterminateSystems/nix-installer-action@v16

      - uses: DeterminateSystems/flakehub-cache-action@v3

      - name: deno cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/deno
          key: ${{ runner.os }}-deno-${{ hashFiles('deno.lock') }}
          restore-keys: |
            ${{ runner.os }}-deno-

      - name: uv cache
        uses: actions/cache@v6
        with:
          path: /tmp/.uv-cache
          key: uv-${{ runner.os }}-${{ hashFiles('s3-tests/requirements.txt') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ hashFiles('s3-tests/requirements.txt') }}
            uv-${{ runner.os }}
 
      - name: start container
        run: nix develop --command deno run --allow-all x/compose-up.ts s3 swift db

      - name: wait for services
        run: |
          echo "Waiting for RustFS..."
          for i in {1..30}; do
            if curl -sf http://localhost:9100/health; then
              echo "RustFS is ready"
              break
            fi
            sleep 2
          done || (echo "RustFS failed to start" && exit 1)

          echo "Waiting for SAIO..."
          for i in {1..60}; do
            if curl -sf http://localhost:8081/healthcheck; then
              echo "SAIO is ready"
              break
            fi
            sleep 2
          done || (echo "SAIO failed to start" && exit 1)

      - name: integration tests
        run: nix develop --command deno task test

      - name: benchmarks
        run: nix develop --command deno bench --allow-all benchmarks/

  s3-tests:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        backend: [rustfs, swift]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: DeterminateSystems/nix-installer-action@v16

      - uses: DeterminateSystems/flakehub-cache-action@v3

      - name: deno cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/deno
          key: ${{ runner.os }}-deno-${{ hashFiles('deno.lock') }}
          restore-keys: |
            ${{ runner.os }}-deno-

      - name: uv cache
        uses: actions/cache@v6
        with:
          path: /tmp/.uv-cache
          key: uv-${{ runner.os }}-${{ hashFiles('s3-tests/requirements.txt') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ hashFiles('s3-tests/requirements.txt') }}
            uv-${{ runner.os }}

      - name: start container
        run: |
          if [ "${{ matrix.backend }}" = "rustfs" ]; then
            nix develop --command deno run --allow-all x/compose-up.ts s3 db
          else
            nix develop --command deno run --allow-all x/compose-up.ts swift db
          fi

      - name: wait for service
        run: |
          if [ "${{ matrix.backend }}" = "rustfs" ]; then
            echo "Waiting for RustFS..."
            for i in {1..30}; do
              if curl -sf http://localhost:9100/health; then
                echo "RustFS is ready"
                exit 0
              fi
              sleep 2
            done
            echo "RustFS failed to start"
            exit 1
          else
            echo "Waiting for SAIO..."
            for i in {1..60}; do
              if curl -sf http://localhost:8081/healthcheck; then
                echo "SAIO is ready"
                exit 0
              fi
              sleep 2
            done
            echo "SAIO failed to start"
            exit 1
          fi

      - name: s3-tests
        run: nix develop --command deno run --allow-all x/s3-tests.ts --backend ${{ matrix.backend }} --no-abort

      - name: prune uv cache
        run: nix develop --command uv cache prune --ci

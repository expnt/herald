name: checks

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: |
          Run the s3-tests job with a detached upterm session for live SSH
          debugging (https://github.com/owenthereal/action-upterm).
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  DOCKER_CMD: docker
  UV_CACHE_DIR: /tmp/.uv-cache

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: DeterminateSystems/nix-installer-action@v22

      - uses: DeterminateSystems/flakehub-cache-action@v3

      - name: pre-commit hooks
        run: nix develop --command prek run --all-files

  integration-tests:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: DeterminateSystems/nix-installer-action@v16

      - uses: DeterminateSystems/flakehub-cache-action@v3

      - name: deno cache restore
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/deno
          key: ${{ runner.os }}-deno-${{ hashFiles('deno.lock') }}
          restore-keys: |
            ${{ runner.os }}-deno-

      # Write the cache only on main: caches created on PR runs are scoped to
      # the PR's merge ref (refs/pull/.../merge) and can only be restored by
      # re-runs of that same PR — never by other PRs — so PR writes just
      # churn the repo's cache budget. The default branch cache is readable
      # by every branch/PR, which is what the restore step above relies on.
      # `always()` keeps the save-on-failure behavior of the combined
      # actions/cache post-phase.
      - name: deno cache save
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/deno
          key: ${{ runner.os }}-deno-${{ hashFiles('deno.lock') }}
      - name: uv cache restore
        uses: actions/cache/restore@v6
        with:
          path: /tmp/.uv-cache
          key: uv-${{ runner.os }}-${{ hashFiles('s3-tests/requirements.txt') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ hashFiles('s3-tests/requirements.txt') }}
            uv-${{ runner.os }}

      - name: uv cache save
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: /tmp/.uv-cache
          key: uv-${{ runner.os }}-${{ hashFiles('s3-tests/requirements.txt') }}
      - name: start container
        run: nix develop --command deno run --allow-all x/compose-up.ts s3 swift db

      - name: wait for services
        run: |
          echo "Waiting for RustFS..."
          for i in {1..30}; do
            if curl -sf http://localhost:9100/health; then
              echo "RustFS is ready"
              break
            fi
            sleep 2
          done || (echo "RustFS failed to start" && exit 1)

          echo "Waiting for SAIO..."
          for i in {1..60}; do
            if curl -sf http://localhost:8081/healthcheck; then
              echo "SAIO is ready"
              break
            fi
            sleep 2
          done || (echo "SAIO failed to start" && exit 1)

      - name: integration tests
        run: nix develop --command deno task test

      - name: benchmarks
        run: nix develop --command deno bench --allow-all benchmarks/

  s3-tests:
    runs-on: ubuntu-latest
    needs: lint
    # Backstop: the runner has its own 25-min pytest timeout, but a hang
    # before pytest (nix develop, deno startup) must also fail, not hang.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        backend: [rustfs, swift]
    steps:
      # Live SSH debugging (requires an SSH key on the triggering GitHub
      # account; the SSH command is printed in this step's log).
      - name: Setup upterm session
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
        uses: owenthereal/action-upterm@v1
        with:
          limit-access-to-actor: true
          detached: true

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: DeterminateSystems/nix-installer-action@v16

      - uses: DeterminateSystems/flakehub-cache-action@v3

      - name: deno cache restore
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/deno
          key: ${{ runner.os }}-deno-${{ hashFiles('deno.lock') }}
          restore-keys: |
            ${{ runner.os }}-deno-

      - name: deno cache save
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/deno
          key: ${{ runner.os }}-deno-${{ hashFiles('deno.lock') }}
      - name: uv cache restore
        uses: actions/cache/restore@v6
        with:
          path: /tmp/.uv-cache
          key: uv-${{ runner.os }}-${{ hashFiles('s3-tests/requirements.txt') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ hashFiles('s3-tests/requirements.txt') }}
            uv-${{ runner.os }}

      - name: uv cache save
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: /tmp/.uv-cache
          key: uv-${{ runner.os }}-${{ hashFiles('s3-tests/requirements.txt') }}
      - name: start container
        run: |
          if [ "${{ matrix.backend }}" = "rustfs" ]; then
            nix develop --command deno run --allow-all x/compose-up.ts s3 db
          else
            nix develop --command deno run --allow-all x/compose-up.ts swift db
          fi

      - name: wait for service
        run: |
          if [ "${{ matrix.backend }}" = "rustfs" ]; then
            echo "Waiting for RustFS..."
            for i in {1..30}; do
              if curl -sf http://localhost:9100/health; then
                echo "RustFS is ready"
                exit 0
              fi
              sleep 2
            done
            echo "RustFS failed to start"
            exit 1
          else
            echo "Waiting for SAIO..."
            for i in {1..60}; do
              if curl -sf http://localhost:8081/healthcheck; then
                echo "SAIO is ready"
                exit 0
              fi
              sleep 2
            done
            echo "SAIO failed to start"
            exit 1
          fi

      # Background hang watcher: dumps process state every 30s to
      # /tmp/hang-watch.log, and SIGKILLs the runner if s3-tests.log goes
      # stale for 10 min — turning a silent hang into a failed step whose
      # artifacts (logs + watcher output) show exactly where it stuck.
      - name: start hang watcher
        run: |
          nohup bash -c '
            WATCH=/tmp/hang-watch.log
            LOG=s3-tests/s3-tests.log
            : > "$WATCH"
            while true; do
              {
                echo "=== $(date -u +%H:%M:%S) ==="
                ps -eo pid,ppid,stat,wchan:25,cmd | grep -E "s3-tests.ts|uv run pytest" | grep -v grep
                for p in $(pgrep -f "deno run.*s3-tests.ts"); do
                  echo "--- pid $p ---"
                  cat /proc/$p/wchan 2>/dev/null
                  head -8 /proc/$p/stack 2>/dev/null
                  ls -l /proc/$p/fd 2>/dev/null | head -12
                done
                if [ -f "$LOG" ]; then
                  age=$(( $(date +%s) - $(stat -c %Y "$LOG") ))
                  if [ "$age" -gt 600 ] && pgrep -f "deno run.*s3-tests.ts" > /dev/null; then
                    echo "STALE $age s — killing runner" >> "$WATCH"
                    pkill -9 -f "deno run.*s3-tests.ts"
                  fi
                fi
              } >> "$WATCH" 2>&1
              sleep 30
            done
          ' > /dev/null 2>&1 &
          echo "hang watcher started (pid $!)"
      - name: s3-tests
        run: nix develop --command deno run --allow-all x/s3-tests.ts --backend ${{ matrix.backend }} --no-abort

      # The runner writes pytest output, proxy logs and junit to the checkout;
      # upload them on failure so a hang/crash is diagnosable even when the
      # step's own output capture is lost.
      - name: upload s3-tests logs
        if: always() && failure()
        uses: actions/upload-artifact@v4
        with:
          name: s3-tests-${{ matrix.backend }}-logs
          path: |
            s3-tests/s3-tests*.log
            s3-tests/herald-proxy*.log
            s3-tests/junit-*.xml
            /tmp/hang-watch.log
          if-no-files-found: ignore
      - name: prune uv cache
        run: nix develop --command uv cache prune --ci

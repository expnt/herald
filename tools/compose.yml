name: herald
services:
  redis:
    profiles: ["db"]
    image: docker.io/library/redis:alpine
    command: --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 3s
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  rustfs:
    profiles: ["s3"]
    image: docker.io/rustfs/rustfs:latest
    ports:
      - "9100:9000"
      - "9101:9001"
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 20s
      retries: 3
    volumes:
      - rustfsdata:/data

  saio:
    profiles: ["swift"]
    image: docker.io/openstackswift/saio:latest
    ports:
      - "8081:8080"

volumes:
  redisdata:
  rustfsdata:

name: herald
services:
  redis:
    profiles: ["db"]
    image: docker.io/library/redis:alpine
    command: --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 3s
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  minio:
    profiles: ["s3"]
    image: docker.io/minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    volumes:
      - miniodata:/data

  saio:
    profiles: ["swift"]
    image: docker.io/openstackswift/saio:latest
    ports:
      - "8080:8080"

volumes:
  redisdata:
  miniodata:

name: herald
namespace: herald

replicaCount: 1

# Herald config (GlobalConfig). Rendered as herald-config.yaml in the ConfigMap.
# See repo README for full config docs. Backends each have protocol, endpoint?, region?,
# credentials?, buckets ("*" or map of bucket name to overrides).
config:
  backends:
    minio:
      protocol: s3
      endpoint: http://minio.herald:9000
      region: us-east-1
      # IMPORTANT: Do not use hard-coded credentials in production!
      # Supply real credentials via:
      #   - Kubernetes Secret referenced in extraEnvFrom (recommended)
      #   - Environment variables (HERALD_<BACKEND>_ACCESS_KEY_ID, HERALD_<BACKEND>_SECRET_ACCESS_KEY)
      #   - Or override these values via Helm --set or values file
      credentials:
        accessKeyId: "<REPLACE_ME>"
        secretAccessKey: "<REPLACE_ME>"
      buckets: "*"
  # Optional: cors, auth (accessKeysRefs) at root or per backend/bucket

image:
  repository: ghcr.io/expnt/herald
  tag: "v0.11.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
deploymentAnnotations: {}
podSecurityContext: {}

securityContext: {}
containerSecurityContext: {}
resources: {}

# envFrom: list of secretRef/configMapRef for env (e.g. backend credentials)
extraEnvFrom: []
# Herald reads HERALD_CONFIG_PATH and PORT; these are set from the chart (see deployment).
# Add HERALD_* or other env here. Backend credentials can go in config or HERALD_<BACKEND>_*.
extraEnv: []

# App port (Herald default 3000). Used for containerPort and health probes.
port: 3000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
# - secretName: web-tls
#   hosts:
#     - chart-example.local

volumeMounts:
  - name: herald
    mountPath: /etc/herald/
    readOnly: true

# Default volume (herald config) is defined in the deployment template with fullname.
# Add extra volumes here if needed.
extraVolumes: []

helmhookjob:
  enabled: false

  annotations: {}

  imagePullSecrets: []

  image:
    repository: alpine
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""
    pullPolicy: IfNotPresent

  command: null

  extraEnvFrom: {}

  extraEnv: []

  resources: {}
